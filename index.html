<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <title>Neon Dodge</title>
    <link rel="stylesheet" href="./style.css?v=2">
</head>

<body>

<div class="app">

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-icon">✦</span>
            <div>
                <h1>NEON DODGE</h1>
                <span>ARCADE MODE</span>
            </div>
        </div>

        <button class="sound-btn" id="soundBtn">🔊</button>
    </header>


    <!-- GAME STATS -->
    <section class="stats">

        <div class="stat">
            <span class="stat-icon">🏆</span>
            <div>
                <small>SCORE</small>
                <strong id="score">0000</strong>
            </div>
        </div>

        <div class="stat">
            <span class="stat-icon">❤️</span>
            <div>
                <small>LIVES</small>
                <strong id="lives">3</strong>
            </div>
        </div>

        <div class="stat">
            <span class="stat-icon">⚡</span>
            <div>
                <small>LEVEL</small>
                <strong id="level">1</strong>
            </div>
        </div>

        <div class="stat">
            <span class="stat-icon">👑</span>
            <div>
                <small>BEST</small>
                <strong id="best">0000</strong>
            </div>
        </div>

    </section>


    <!-- GAME -->
    <main class="game-wrapper">

        <div class="game" id="game">

            <div class="stars"></div>

            <div class="grid"></div>

            <!-- START SCREEN -->
            <div class="screen" id="startScreen">

                <div class="logo">
                    <div class="logo-ring">✦</div>
                </div>

                <p class="eyebrow">WELCOME TO THE ARCADE</p>

                <h2>NEON<br><span>DODGE</span></h2>

                <p class="description">
                    Dodge the falling obstacles.<br>
                    Survive as long as you can.
                </p>

                <button class="primary-btn" id="startBtn">
                    PLAY NOW
                    <span>→</span>
                </button>

                <div class="controls-info">
                    <span>← →</span>
                    <span>or</span>
                    <span>A D</span>
                    <small>MOVE</small>
                </div>

            </div>


            <!-- GAME OVER -->
            <div class="screen hidden" id="gameOverScreen">

                <div class="game-over-icon">💥</div>

                <p class="eyebrow">GAME OVER</p>

                <h2>MISSION<br><span>FAILED</span></h2>

                <div class="result">
                    <div>
                        <small>SCORE</small>
                        <strong id="finalScore">0000</strong>
                    </div>

                    <div>
                        <small>BEST</small>
                        <strong id="finalBest">0000</strong>
                    </div>
                </div>

                <p id="resultMessage">Nice try, pilot.</p>

                <button class="primary-btn" id="restartBtn">
                    PLAY AGAIN
                    <span>↻</span>
                </button>

            </div>


            <!-- PLAYER -->
            <div class="player" id="player">
                <div class="ship-glow"></div>
                <div class="ship">▲</div>
            </div>

            <!-- PAUSE -->
            <button class="pause-btn" id="pauseBtn">Ⅱ</button>

        </div>


        <!-- MOBILE CONTROLS -->
        <div class="mobile-controls">

            <button id="leftBtn">←</button>

            <button id="rightBtn">→</button>

        </div>

    </main>


    <footer>
        <span>NEON DODGE</span>
        <span>•</span>
        <span>Made for fun ✦</span>
    </footer>

</div>

<script src="./script.js?v=2"></script>

</body>
</html>
